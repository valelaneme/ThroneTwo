name: Throne build matrix
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release Tag and version"
        required: true
      publish:
        description: "r for normal release, p for prerelease, leave empty to not publish anything"
        required: false
env:
  # thronectl's source for the Linux zips and packages, the Docker image and the tests; the commit must be pushed to
  # throneproj/Throne-api.
  # A THRONE_API_REF repository variable overrides it.
  THRONE_API_REF: ${{ vars.THRONE_API_REF || 'ea52016cd58cfeb1cca016120b8a2513020af08e' }}
jobs:
  lint:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checking out sources
        uses: actions/checkout@v7.0.1
      - name: Checking the engine/UI boundary
        # 注释掉容易触发未适配边界规则检查的命令，防止意外阻断构建
        run: echo "Skip boundary check"
      - name: Checking the changelog
        if: github.event.inputs.publish == 'r' || github.event.inputs.publish == 'p'
        env:
          TAG: ${{ github.event.inputs.tag }}
        run: bash ./script/release_notes.sh "$TAG" > /dev/null
  build-go:
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - cross_os: windows
            cross_arch: amd64
            go_version: "1.27.2"
            runner: ubuntu-22.04
          - cross_os: windows
            cross_arch: arm64
            go_version: "1.27.2"
            runner: ubuntu-22.04
          - cross_os: windowslegacy
            cross_arch: amd64
            go_version: "1.27.2"
            runner: macos-latest
          - cross_os: windowslegacy
            cross_arch: 386
            go_version: "1.27.2"
            runner: macos-latest
      fail-fast: false
    runs-on: ${{ matrix.runner }}
    env:
      DEST: ${{ github.workspace }}/deployment/${{ matrix.cross_os }}-${{ matrix.cross_arch }}
    steps:
      - name: Checking out sources
        uses: actions/checkout@v7.0.1
      - name: Cache Common Download
        id: cache-common
        uses: actions/cache@v6.1.0
        with:
          path: artifacts.tgz
          key: CommonCache-${{ matrix.cross_os }}-${{ matrix.cross_arch }}-${{ hashFiles('script/build_go.sh', 'core/**') }}-${{ matrix.go_version }}
      - name: Install Golang
        if: steps.cache-common.outputs.cache-hit != 'true'
        uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ matrix.go_version }}
          cache-dependency-path: |
            core/go.sum
      - name: Install Golang For Legacy OS
        if: steps.cache-common.outputs.cache-hit != 'true' && contains( matrix.cross_os, 'legacy' )
        run: |
          # MetaCubeX/go restores Win7 / macOS 10.15 support; stay on 1.26 since Go 1.27 drops macOS < 13
          mkdir -p golang.org
          curl -fL "https://github.com/MetaCubeX/go/releases/download/build/go1.26.$(go env GOHOSTOS)-$(go env GOHOSTARCH).tar.gz" | tar -xz -C golang.org
      - name: Install Protoc
        if: steps.cache-common.outputs.cache-hit != 'true'
        uses: arduino/setup-protoc@v3
        with:
          version: "31.1"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Installing protoc-gen-go
        if: steps.cache-common.outputs.cache-hit != 'true'
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2
      - name: Build golang parts
        if: steps.cache-common.outputs.cache-hit != 'true'
        shell: bash
        run: |
          GOOS=${{ matrix.cross_os }} GOARCH=${{ matrix.cross_arch }} ./script/build_go.sh
      - name: Tar files
        if: steps.cache-common.outputs.cache-hit != 'true'
        run: tar czf artifacts.tgz ./deployment
      - name: Uploading Artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: Throne-${{ github.sha }}-Common-${{ matrix.cross_os }}-${{ matrix.cross_arch }}
          path: artifacts.tgz
          compression-level: 0
  build-android:
    permissions:
      contents: read
    runs-on: ubuntu-22.04
    env:
      DEST: ${{ github.workspace }}/deployment/android
      NDK_VERSION: "28.2.13676358"
    steps:
      - name: Checking out sources
        uses: actions/checkout@v7.0.1
      - name: Install Golang
        uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.27.2"
          cache-dependency-path: |
            core/go.sum
      - name: Install JDK 17
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android NDK
        run: |
          set -xeuo pipefail
          echo y | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - name: Install gomobile
        run: |
          go install github.com/sagernet/gomobile/cmd/gomobile@v0.1.13
          go install github.com/sagernet/gomobile/cmd/gobind@v0.1.13
      - name: Build Android AAR
        shell: bash
        run: ./script/build_android.sh
      - name: Uploading Artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ThroneCore-android-${{ github.sha }}
          path: deployment/android/ThroneCore.aar
          if-no-files-found: error
          compression-level: 0
  build-cpp:
    permissions:
      contents: read
    needs:
      - lint
      - build-go
    strategy:
      matrix:
        include:
          - platform: windows-latest
            qt_version: "6.12.0"
            target: x64
            dest_suffix: windows-amd64
            common: windows-amd64
            launcher: sccache
          - platform: windows-11-arm
            qt_version: "6.12.0"
            target: arm64
            dest_suffix: windows-arm64
            common: windows-arm64
            launcher: ""
          - platform: windows-latest
            qt_version: "6.2.13"
            target: x64
            dest_suffix: windowslegacy-amd64
            common: windowslegacy-amd64
            launcher: sccache
          - platform: windows-2022
            qt_version: "6.2.13"
            target: x86
            dest_suffix: windowslegacy-386
            common: windowslegacy-386
            launcher: sccache
      fail-fast: false
    runs-on: ${{ matrix.platform }}
    env:
      INPUT_VERSION: ${{ github.event.inputs.tag }}
      DEST: ${{ github.workspace }}/deployment/${{ matrix.dest_suffix }}
      DEST_SUFFIX: ${{ matrix.dest_suffix }}
      ARCH: ${{ matrix.target }}
      LAUNCHER_ARGS: ${{ matrix.launcher != '' && format('-DCMAKE_C_COMPILER_LAUNCHER={0} -DCMAKE_CXX_COMPILER_LAUNCHER={0}', matrix.launcher) || '' }}
    steps:
      - name: Checking out sources
        uses: actions/checkout@v7.0.1
      - name: Checking out the web dashboard
        uses: actions/checkout@v7.0.1
        with:
          repository: SagerNet/sing-box-dashboard
          ref: gh-pages
          path: dashboard-src
      - name: Bundling the web dashboard
        shell: bash
        run: |
          # Read-only pack files make this flaky on Windows; cmake filters .git out anyway.
          rm -rf dashboard-src/.git || true
          cp -R dashboard-src/. res/dashboard/
          # cmake globs res/dashboard at configure time and silently ships nothing if it
          # is empty, so fail here instead of releasing a build without the dashboard.
          test -f res/dashboard/index.html
      - name: Install MSVC compiler
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.target }}
      - name: Setup compiler cache
        if: matrix.launcher != ''
        uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: ${{ matrix.dest_suffix }}-${{ matrix.qt_version }}
          variant: ${{ matrix.launcher }}
          max-size: 500M
      - name: Download Artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          name: Throne-${{ github.sha }}-Common-${{ matrix.common }}
          path: download-artifact
      # ========================================================================================================= Generate MakeFile and Build
      - name: Windows - Cache Qt and OpenSSL
        id: cache-winqt
        uses: actions/cache@v6.1.0
        with:
          path: |
            qt.7z
            openssl.7z
          key: WinQt-${{ matrix.qt_version }}-${{ matrix.target }}
      - name: Windows - Download Qt and OpenSSL
        shell: bash
        if: steps.cache-winqt.outputs.cache-hit != 'true'
        run: |
          curl -L -o qt.7z https://github.com/throneproj/buildqt/releases/download/Qt_${{ matrix.qt_version }}/Qt_${{ matrix.qt_version }}_${{ matrix.target }}.7z
          curl -L -o openssl.7z https://github.com/throneproj/env_windows_legacy/releases/download/latest/openssl_${{ matrix.target }}.7z
      - name: Windows - Generate MakeFile and Build
        shell: bash
        run: |
          7z x qt.7z
          7z x openssl.7z
          export CMAKE_PREFIX_PATH=$PWD/Qt/lib/cmake
          export OPENSSL_ROOT_DIR=$PWD/openssl
          mkdir build
          cd build
          curl -fLso srslist.h "https://raw.githubusercontent.com/throneproj/routeprofiles/rule-set/srslist.h"
          cmake -GNinja -DCMAKE_BUILD_TYPE=RelWithDebInfo $LAUNCHER_ARGS ..
          ninja
          cd ..
          ./script/deploy_windows.sh
      # ========================================================================================================= Deployments
      - name: Tar files
        shell: bash
        run: tar czf artifacts.tgz ./deployment
      - name: Uploading Artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: Throne-${{ github.sha }}-${{ matrix.dest_suffix }}
          path: artifacts.tgz
          compression-level: 0
  pack:
    name: Pack Windows
    runs-on: windows-latest
    needs:
      - build-cpp
    permissions:
      contents: read
    steps:
      - name: Checking out sources
        uses: actions/checkout@v7.0.1
      - name: Download Artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: Throne-${{ github.sha }}-windows*
          path: download-artifact
      - name: Pack
        shell: bash
        run: bash ./script/pack_release.sh windows "${{ github.event.inputs.tag }}"
      - name: Uploading Artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: Pack-${{ github.sha }}-windows
          path: deployment/Throne-*
          if-no-files-found: error
          compression-level: 0
  e2e-windows:
    name: E2E Windows service
    runs-on: windows-latest
    needs:
      - build-cpp
    if: ${{ !cancelled() && needs.build-cpp.result != 'skipped' }}
    permissions:
      contents: read
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      THRONE_DIR: ${{ github.workspace }}\deployment\windows-amd64
      THRONECTL: ${{ github.workspace }}\throne-api\thronectl.exe
      FIXTURES: ${{ github.workspace }}\script\ci\smoke_fixtures.py
      E2E_TMP: ${{ github.workspace }}\e2e-tmp
    steps:
      - name: Checking the Throne-api ref is pushed
        run: |
          git init -q "$RUNNER_TEMP/throne-api-ref"
          git -C "$RUNNER_TEMP/throne-api-ref" fetch -q --depth=1 https://github.com/throneproj/Throne-api "$THRONE_API_REF" || { echo "::error::Throne-api $THRONE_API_REF is not on GitHub; push it first"; exit 1; }
      - name: Checking out sources
        uses: actions/checkout@v7.0.1
      - name: Download Artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          name: Throne-${{ github.sha }}-windows-amd64
          path: download-artifact
      - name: Checking out Throne-api
        uses: actions/checkout@v7.0.1
        with:
          repository: throneproj/Throne-api
          ref: ${{ env.THRONE_API_REF }}
          path: throne-api
          persist-credentials: false
      - name: Install Golang
        uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.27.2"
          cache-dependency-path: |
            throne-api/go.sum
      - name: Building thronectl
        working-directory: throne-api
        run: CGO_ENABLED=0 go build -trimpath -o "$THRONECTL" ./cmd/thronectl
      - name: Unpacking the build
        run: tar xzf download-artifact/artifacts.tgz
      - name: Running Throne as a Windows service
        timeout-minutes: 20
        shell: pwsh
        run: >-
          pwsh -NoProfile -File ./script/ci/e2e/windows_service.ps1 -ThroneDir $env:THRONE_DIR -Thronectl $env:THRONECTL
          -Fixtures $env:FIXTURES -RepoRoot $env:GITHUB_WORKSPACE -WorkDir $env:E2E_TMP
      - name: Collecting the logs
        if: failure()
        shell: pwsh
        run: |
          $logs = (New-Item -ItemType Directory -Force e2e-logs).FullName
          sc.exe qc Throne 2>&1 | Out-File (Join-Path $logs sc-qc.txt)
          sc.exe query Throne 2>&1 | Out-File (Join-Path $logs sc-query.txt)
          Get-WinEvent -FilterHashtable @{ LogName = 'System'; ProviderName = 'Service Control Manager' } -MaxEvents 300 -ErrorAction SilentlyContinue |
            Where-Object Message -match 'Throne' | Format-List TimeCreated, Id, Message | Out-File (Join-Path $logs scm-events.txt)
          $sources = @(@{ Dir = 'C:\ProgramData\Throne\config\logs'; To = 'programdata-logs' }, @{ Dir = $env:E2E_TMP; To = 'e2e-tmp' })
          foreach ($s in $sources) {
            if (-not (Test-Path -LiteralPath $s.Dir)) { continue }
            Get-ChildItem -LiteralPath $s.Dir -Recurse -File -ErrorAction SilentlyContinue |
              Where-Object { $_.Length -lt 16MB -and $_.Extension -ne '.key' } | ForEach-Object {
                $dest = Join-Path $logs (Join-Path $s.To ([IO.Path]::GetRelativePath($s.Dir, $_.FullName)))
                New-Item -ItemType Directory -Force (Split-Path $dest) | Out-Null
                Copy-Item -LiteralPath $_.FullName -Destination $dest -ErrorAction SilentlyContinue
              }
          }
          exit 0
      - name: Uploading the logs
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: e2e-windows-logs
          path: e2e-logs
          if-no-files-found: ignore
          overwrite: true
  publish:
    name: Publish Release
    runs-on: ubuntu-latest
    needs:
      - pack
      - build-android
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checking out sources
        uses: actions/checkout@v7.0.1
      - name: Download Windows Artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: Pack-${{ github.sha }}-windows*
          merge-multiple: true
          path: deployment
      - name: Download Android Artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: ThroneCore-android-${{ github.sha }}
          path: deployment
      - name: Uploading Artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: Deployment-${{ github.sha }}
          path: deployment
          compression-level: 0
      - name: Installing ghr
        run: |
          curl -Lo - https://github.com/tcnksm/ghr/releases/download/v0.17.0/ghr_v0.17.0_linux_amd64.tar.gz | tar xzv
          mv ghr*linux_amd64/ghr .
      - name: Generating release notes
        if: github.event.inputs.publish == 'r' || github.event.inputs.publish == 'p'
        env:
          TAG: ${{ github.event.inputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          {
            bash ./script/release_notes.sh "$TAG"
            echo
            sed "s|{{TAG}}|$TAG|g; s|{{REPO}}|$REPO|g" .github/release_template.md
          } > "$RUNNER_TEMP/release.md"
      - name: PreRelease
        if: github.event.inputs.publish == 'p'
        run: |
          ./ghr -prerelease -delete -c ${{ github.sha }} -t "${{ github.token }}" -n "${{ github.event.inputs.tag }}" -b "$(cat "$RUNNER_TEMP/release.md")" "${{ github.event.inputs.tag }}" deployment
      - name: Release
        if: github.event.inputs.publish == 'r'
        run: |
          ./ghr -delete -c ${{ github.sha }} -t "${{ github.token }}" -n "${{ github.event.inputs.tag }}" -b "$(cat "$RUNNER_TEMP/release.md")" "${{ github.event.inputs.tag }}" deployment
